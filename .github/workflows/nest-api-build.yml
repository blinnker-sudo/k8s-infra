name: Build Nest API

on:
  push:
    branches: [main]
    paths:
      - 'apps/nest-api/**'

concurrency:
  group: git-push
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/nest-api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nest-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/nest-api:latest

      - name: Update image tag in values-dev.yaml
        run: |
          sed -i "s|tag:.*|tag: ${{ github.sha }}|" helm/nest-api/values-dev.yaml

      - name: Commit and push values change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/nest-api/values-dev.yaml
          git diff --staged --quiet && exit 0
          git commit -m "ci: update nest-api image to ${{ github.sha }}"
          git pull --rebase origin main
          git push
