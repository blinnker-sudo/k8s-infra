name: Build Spring API

# Este workflow se dispara cuando:
# - Se hace push a main
# - Y los cambios tocan archivos dentro de apps/spring-api/
on:
  push:
    branches: [main]
    paths:
      - 'apps/spring-api/**'

# Evita que este workflow y el de nest-api hagan git push al mismo tiempo.
# Si dos corren en paralelo, uno espera al otro.
concurrency:
  group: git-push
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Para poder hacer commit+push de los values.yaml
      packages: write     # Para poder subir imagen a ghcr.io

    steps:
      # 1. Descargar el código del repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Login a GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Construir la imagen Docker usando el Dockerfile de la app
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/spring-api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spring-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/spring-api:latest

      # 4. Actualizar el tag en values-dev.yaml (simulamos deploy a dev)
      - name: Update image tag in values-dev.yaml
        run: |
          sed -i "s|tag:.*|tag: ${{ github.sha }}|" helm/spring-api/values-dev.yaml

      # 5. Hacer commit del cambio para que ArgoCD lo detecte
      - name: Commit and push values change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/spring-api/values-dev.yaml
          git diff --staged --quiet && exit 0
          git commit -m "ci: update spring-api image to ${{ github.sha }}"
          # Si alguien pusheó mientras corría este workflow, traemos esos cambios antes
          git pull --rebase origin main
          git push
