replicaCount: 1

image:
  repository: ghcr.io/blinnker-sudo/nest-api
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  host: nest.local

config:
  # URL del servicio de Spring Boot (Service Discovery de Kubernetes)
  SPRING_API_URL: "http://spring-api"
  LOG_LEVEL: "info"

secrets:
  API_TOKEN: "cambiar-en-cada-ambiente"
