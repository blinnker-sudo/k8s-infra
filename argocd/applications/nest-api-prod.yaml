apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nest-api-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/blinnker-sudo/k8s-infra.git
    targetRevision: HEAD
    path: helm/nest-api
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
